# Weekly update pull requests. Actions are pinned by commit SHA: Dependabot moves the SHA and
# the version comment together.
# No "swift" entry: Dependabot cannot parse the conditional dependency in Package.swift (the job
# fails on the exact pin). Dependabot alerts still cover Sparkle, through the dependency graph
# (Package.resolved). Update it by hand after reading its release notes.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
