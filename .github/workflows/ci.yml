name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build, test, package
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # tags and commit count give the app version
          persist-credentials: false

      - name: Toolchain
        run: swift --version

      - name: Build
        run: swift build

      - name: Test
        run: scripts/test.sh

      - name: Build the Mac App Store edition (no Sparkle)
        run: CLAMSTOP_EDITION=appstore swift build --scratch-path .build/appstore

      - name: Assemble the app (ad-hoc signature)
        run: scripts/build-app.sh

      - name: Check the bundle
        run: scripts/verify-app.sh

      - name: Create the DMG
        run: scripts/make-dmg.sh

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ClamStop-unsigned-dmg
          path: dist/*.dmg
          if-no-files-found: error
          retention-days: 14
