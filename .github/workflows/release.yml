name: Release

# Pushing a tag such as v1.2.3 publishes a GitHub Release. The build is signed and notarized
# when the secrets described in docs/signing.md exist, ad-hoc signed otherwise. With the
# SPARKLE_ED_PRIVATE_KEY secret (docs/updates.md), the release also carries appcast.xml, the
# feed installed apps check for updates.
#
# "Run workflow" (workflow_dispatch) is a dry run, version 0.0.0: same build, signature,
# notarization and appcast, kept as a workflow artifact. Nothing is published, and the run
# fails when a secret is missing.
#
# The secrets live in the "release" environment: a run starts only from main or a v* tag, and
# waits for an approval (Actions > the run > Review deployments).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish
    runs-on: macos-26
    timeout-minutes: 90
    environment: release # holds the signing secrets
    permissions:
      contents: write # create the GitHub Release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the commit count gives the build number
          persist-credentials: false

      - name: Version from the tag
        run: |
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          else
            echo "VERSION=0.0.0" >> "$GITHUB_ENV"
          fi

      # A tag can point to any commit: only publish what went through main.
      - name: Check that the tag is on main
        if: github.event_name == 'push'
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || {
            echo "::error::$GITHUB_REF_NAME is not a commit of main: not released."
            exit 1
          }

      # Fails instead of silently resolving something else than Package.resolved.
      - name: Resolve the pinned dependencies
        run: swift package --force-resolved-versions resolve

      - name: Test
        run: scripts/test.sh

      - name: Import the signing certificate
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: scripts/import-certificate.sh

      - name: Assemble and sign the app
        run: scripts/build-app.sh

      - name: Check the bundle
        run: scripts/verify-app.sh

      - name: Notarize the app
        env:
          NOTARY_API_KEY_P8_BASE64: ${{ secrets.NOTARY_API_KEY_P8_BASE64 }}
          NOTARY_API_KEY_ID: ${{ secrets.NOTARY_API_KEY_ID }}
          NOTARY_API_ISSUER_ID: ${{ secrets.NOTARY_API_ISSUER_ID }}
        run: scripts/notarize.sh dist/ClamStop.app

      - name: Create the DMG
        run: scripts/make-dmg.sh

      - name: Notarize the DMG
        env:
          NOTARY_API_KEY_P8_BASE64: ${{ secrets.NOTARY_API_KEY_P8_BASE64 }}
          NOTARY_API_KEY_ID: ${{ secrets.NOTARY_API_KEY_ID }}
          NOTARY_API_ISSUER_ID: ${{ secrets.NOTARY_API_ISSUER_ID }}
        run: scripts/notarize.sh "dist/ClamStop-$VERSION.dmg"

      # After notarization: stapling changes the DMG, and the signature covers its final bytes.
      - name: Sparkle appcast (EdDSA signature of the DMG)
        env:
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: scripts/make-appcast.sh "dist/ClamStop-$VERSION.dmg"

      - name: Gatekeeper assessment (notarized builds)
        run: |
          if xcrun stapler validate "dist/ClamStop-$VERSION.dmg"; then
            spctl --assess --type execute --verbose=2 dist/ClamStop.app
            spctl --assess --type open --context context:primary-signature --verbose=2 \
              "dist/ClamStop-$VERSION.dmg"
          elif [ "$GITHUB_EVENT_NAME" = push ]; then
            echo "::warning::This release is not notarized (see docs/signing.md)."
          else
            echo "::error::Dry run: the build is not notarized (see docs/signing.md)."
            exit 1
          fi

      - name: Check the appcast (dry run)
        if: github.event_name == 'workflow_dispatch'
        run: |
          [ -f dist/appcast.xml ] || {
            echo "::error::Dry run: no appcast.xml (see docs/updates.md)."
            exit 1
          }

      - name: Keep the build (dry run)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ClamStop-dry-run
          path: |
            dist/*.dmg
            dist/appcast.xml
          if-no-files-found: error
          retention-days: 14

      - name: Publish the GitHub Release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: scripts/publish-release.sh

      - name: Delete the signing keychain
        if: always()
        run: |
          if [ -n "${SIGN_KEYCHAIN:-}" ] && [ -f "$SIGN_KEYCHAIN" ]; then
            security delete-keychain "$SIGN_KEYCHAIN"
          fi
